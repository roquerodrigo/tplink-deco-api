[project]
name = "tplink-deco-api"
version = "2.0.0"
description = "Python SDK for controlling TP-Link Deco routers via the internal HTTP API"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Roque", email = "rodrigogoncalvesroque@gmail.com" }]
keywords = ["tplink", "deco", "mesh", "wifi", "router", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=46.0.7",
]

[project.urls]
Homepage = "https://github.com/roquerodrigo/tplink-deco-api"
Repository = "https://github.com/roquerodrigo/tplink-deco-api"
Issues = "https://github.com/roquerodrigo/tplink-deco-api/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tplink_deco_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src/tplink_deco_api",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.16 formats Python blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # explicit `Any` is already banned by mypy's disallow_any_explicit
    "COM812",  # trailing commas are the formatter's call
    "CPY001",  # the licence lives in LICENSE, not in a header on every file
    "D105",    # magic methods are covered by the class docstring
    "D107",    # __init__ is covered by the class docstring
    "D203",    # mutually exclusive with D211, which matches the formatter
    "D212",    # multi-line summaries start on the line below the quotes
    "ISC001",  # conflicts with the formatter
    "TID252",  # modules reach their siblings through relative imports
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# MD5 is what the router's signature scheme mandates, not a choice of ours.
"src/tplink_deco_api/crypto/hash.py" = ["S324"]
# The URL is always the router's own http(s) endpoint, built by this package.
"src/tplink_deco_api/auth/transport.py" = ["S310"]
# `default` carries a fallback value, not a control flag, and a malformed top
# level is the same failure class as a syntax error, so it stays a ValueError.
"src/tplink_deco_api/_json.py" = ["FBT001", "FBT002", "TRY004"]
"tests/*" = [
    "D",        # no docstrings required in tests
    "PLC0415",  # local imports keep import-time behaviour under test
    "PLR2004",  # magic numbers in assertions are fine
    "S101",     # assert is how pytest works
    "S324",     # the MD5 helper is the subject under test
    "SLF001",   # exercising private internals is intentional
    "T201",     # the live login script reports progress on stdout
]
"examples/*" = [
    "PLC0415",  # optional imports stay inside the branch that needs them
    "T201",     # examples are meant to print
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = true
